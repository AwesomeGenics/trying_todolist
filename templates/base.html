<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      header {
        background-color: #06d6a0;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px 20px 20px 20px;
      }
      footer {
        background-color: #06d6a0;
        text-align: center;
        padding: 20px 20px 20px 20px;
      }
      body {
        /* Use the full height of the device screen */
        min-height: 100dvh;

        /* Turn the body into a flexbox column layout */
        display: flex;
        flex-direction: column;
        margin: 0;
      }

      main {
        /* This allows the main section to grow and take up all available space */
        flex-grow: 1;
      }

      footer {
        /* Ensures the footer gets pushed to the absolute bottom if content is short */
        margin-top: auto;
      }
      label {
        padding: 20px 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Extremely Basic To-do List</h1>

      <nav>
        <label><a href="/add">Add a Task</a></label>
        <label><a href="/home">View all tasks</a></label>
        <label><a href="/logout">Logout</a></label>
      </nav>
      <br />
      {% block description %} {% endblock %}
    </header>
    <main>{% block main %} {% endblock %}</main>
    <footer>Kaisi lag rhi website do let me know :)</footer>
  </body>
</html>
