{%extends 'base.html' %} {%block description%} Individual task deletion,
separate tasks per account — let me know if you've got feedback {%endblock%}
{% block main%}
<style>
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
  }
  ul.tasks {
    list-style: none;
    margin: 0 0 2rem;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  ul.tasks li {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  ul.tasks li .marker {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border: 2px solid var(--accent);
    border-radius: 3px;
  }
  ul.tasks li .task-text {
    flex-grow: 1;
    font-size: 1.02rem;
    word-break: break-word;
  }
  ul.tasks li form {
    margin: 0;
  }
  ul.tasks li button.delete {
    background: none;
    border: none;
    color: var(--brick);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 2px;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.15s ease;
  }
  ul.tasks li button.delete:hover,
  ul.tasks li button.delete:focus-visible {
    text-decoration-color: var(--brick);
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .footer-row form {
    margin: 0;
  }
  .footer-row button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    padding: 0.65rem 1.1rem;
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  .footer-row button:hover {
    background: var(--accent-dark);
  }
  .signed-in {
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
</style>
<div class="wrap">
  <ul class="tasks">
    {%for num, task, name in tasksaslist%}
    <li>
      <span class="marker"></span>
      <span class="task-text">{{ task }}</span>
      <form action="/delete/{{num}}" method="post">
        <button type="submit" name="delete" value="delete" class="delete">
          delete
        </button>
      </form>
    </li>
    {%endfor%}
  </ul>
  <div class="footer-row">
    <form action="/home" method="post">
      <button type="submit">Clear list</button>
    </form>
    <span class="signed-in">{{name}}</span>
  </div>
</div>
{%endblock%}
