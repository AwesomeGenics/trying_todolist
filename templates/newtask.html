{%extends 'base.html' %} {%block description%} Add a new task to your list
{%endblock%} {% block main %}
<style>
  .task-wrap {
    max-width: 480px;
    margin: 3rem auto;
    padding: 0 1.25rem;
  }
  .task-wrap form {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .task-wrap label {
    padding: 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-weight: 500;
  }
  input[type="text"] {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.7rem 0.1rem;
    border: none;
    border-bottom: 2px solid var(--line);
    background: transparent;
    color: var(--ink);
    transition: border-color 0.15s ease;
    margin-bottom: 1.1rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  input[type="submit"] {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    padding: 0.8rem;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-body);
  }
  input[type="submit"]:hover {
    background: var(--accent-dark);
  }
  p.notice {
    color: var(--brick);
    font-size: 0.9rem;
    margin-top: 1rem;
  }
</style>
<div class="task-wrap">
  <form action="/add" method="post">
    <label for="task">Task name</label>
    <input type="text" name="task" id="task" placeholder="What needs doing?" />
    <input type="submit" value="Save task" />
  </form>
  {% with messages = get_flashed_messages()%} {%if messages%}
  <p class="notice">{{messages[0]}}</p>
  {%endif%} {%endwith%}
</div>
{%endblock%}
